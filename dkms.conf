PACKAGE_NAME="t2-sep-boot-state"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="t2_sep_boot_state"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
# DKMS skips kernels that do not match, and a skipped build cannot stop a
# kernel update. Add a kernel series here after a test build for it.
BUILD_EXCLUSIVE_KERNEL="^7\.3\."
# The module needs the macsmc ACPI backend, which so far only t2linux kernels have.
BUILD_EXCLUSIVE_CONFIG="CONFIG_MACSMC_ACPI"
